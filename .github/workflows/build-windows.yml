name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $csproj = Get-Content src/EmbyRemotePlayer/EmbyRemotePlayer.csproj -Raw
          if ($csproj -match '<Version>\s*([^<]+?)\s*</Version>') { "version=$($Matches[1])" >> $env:GITHUB_OUTPUT } else { "version=0.0.0" >> $env:GITHUB_OUTPUT }
      - name: Restore
        run: dotnet restore src/EmbyRemotePlayer/EmbyRemotePlayer.csproj -r win-x64
      - name: Build
        run: dotnet build src/EmbyRemotePlayer/EmbyRemotePlayer.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish src/EmbyRemotePlayer/EmbyRemotePlayer.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: EmbyRemotePlayer-v${{ steps.ver.outputs.version }}-win-x64
          path: publish/win-x64
